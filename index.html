<html lang="zh-CN">

    <meta name="theme-color" content="#ffd9e7" />
    <meta name="description" content="桃桃茶屋：在粉桃与薄荷色的 3D 小店里，为可爱的客人们调一杯刚刚好的奶茶。" />
    <title>桃桃茶屋 · Peach & Mint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"

      <div class="scene-wash"></div>
      <div class="scene-vignette"></div>
      <div class="ui-petals" id="ui-petals" aria-hidden="true"></div>
      <div id="world-ui" class="world-ui"></div>
      <div id="hud" class="hud"></div>
      <div id="screen-root" class="screen-root"></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
      <div id="flash" class="flash-layer"></div>
      <div id="boot" class="boot">
        <div class="boot-mark">
          <div class="boot-cup"><i></i><i></i><i></i></div>
          <div class="boot-name">桃桃茶屋</div>
          <div class="boot-sub">正在煮茶、摆好杯子…</div>
          <div class="boot-bar"><span></span></div>

    <script type="module" src="/src/main.ts"></script>
